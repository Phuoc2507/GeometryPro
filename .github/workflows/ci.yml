name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec tsc -- -p tsconfig.app.json --noEmit
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run smoke:kernel
      - run: npm run build
